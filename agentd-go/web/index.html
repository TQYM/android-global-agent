<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentd · Android 本地 Agent</title>
<style>
:root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#8b93a3; --accent:#4f8cff; --ok:#3fb950; --err:#f85149; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
header h1 { font-size:16px; margin:0; }
.badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#2a2f3a; color:var(--dim); }
.badge.run { background:#13321a; color:var(--ok); }
main { display:grid; grid-template-columns:340px 1fr; gap:14px; padding:14px 20px; }
@media (max-width:860px){ main { grid-template-columns:1fr; } }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
.card h2 { font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600; }
label { display:block; font-size:12px; color:var(--dim); margin:8px 0 3px; }
input, textarea, button { width:100%; background:#0c0e12; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:8px 10px; font:inherit; }
button { cursor:pointer; background:var(--accent); border:none; color:#fff; font-weight:600; }
button.secondary { background:#2a2f3a; }
button.recording { background:var(--err); animation:blink 1s infinite; }
@keyframes blink { 50% { opacity:.55; } }
button:disabled { opacity:.5; cursor:not-allowed; }
.row { display:flex; gap:8px; margin-top:10px; }
.row button { flex:1; }
#logs { height:260px; overflow:auto; background:#0c0e12; border:1px solid var(--line); border-radius:6px; padding:8px; font:12px/1.6 ui-monospace,Consolas,monospace; white-space:pre-wrap; }
.screenwrap { position:relative; }
#screen { width:100%; max-height:420px; object-fit:contain; background:#000; border:1px solid var(--line); border-radius:6px; display:block; }
.tapdot { position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%;
  border:3px solid var(--accent); background:rgba(79,140,255,.25); pointer-events:none;
  animation:tapPulse 1.2s ease-out infinite; }
@keyframes tapPulse { 0% { transform:scale(.4); opacity:1; } 100% { transform:scale(1.4); opacity:0; } }
table { width:100%; border-collapse:collapse; font-size:12px; }
th,td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
th { color:var(--dim); font-weight:600; }
#nodes { max-height:300px; overflow:auto; }
.hint { color:var(--dim); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>agentd</h1>
  <span class="badge" id="badge">空闲</span>
  <span style="flex:1"></span>
  <span class="badge" id="testBadge"></span>
</header>

<main>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <h2>LLM API 配置</h2>
      <label>Base URL</label>
      <input id="base_url" placeholder="https://api.ccode.vip">
      <label>API Key</label>
      <input id="api_key" type="password" placeholder="sk-...">
      <label>模型</label>
      <input id="model" placeholder="gpt-5.4">
      <label>语音识别模型</label>
      <input id="asr_model" placeholder="glm-asr-2512">
      <label>最大步数</label>
      <input id="max_steps" type="number" value="20">
      <label style="display:flex;align-items:center;gap:6px;color:var(--fg);cursor:pointer">
        <input id="vision" type="checkbox" style="width:auto"> 视觉模式（把截图发给模型，需视觉模型如 glm-4.5v / glm-4v-plus）
      </label>
      <div class="row">
        <button id="saveCfg">保存配置</button>
        <button id="testBtn" class="secondary">测试感知</button>
      </div>
      <div class="hint">配置保存在设备本地 /data/local/tmp/agentd/config.json</div>
    </div>

    <div class="card">
      <h2>任务</h2>
      <textarea id="task" rows="3" placeholder="例如：打开 WLAN 设置 / 给微信里的妈妈发消息说明天回家"></textarea>
      <div class="row">
        <button id="mic" class="secondary">🎤 语音输入</button>
      </div>
      <label style="display:flex;align-items:center;gap:6px;color:var(--fg);cursor:pointer;margin-top:6px">
        <input id="autoRun" type="checkbox" style="width:auto" checked> 识别完成后直接运行
      </label>
      <div class="row">
        <button id="run">运行</button>
        <button id="stop" class="secondary" disabled>停止</button>
      </div>
    </div>

    <div class="card">
      <h2>实时日志</h2>
      <div id="logs"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <h2>屏幕（实时）</h2>
      <div class="screenwrap">
        <img id="screen" alt="截图">
        <div id="tapdot" class="tapdot" style="display:none"></div>
      </div>
    </div>
    <div class="card">
      <h2>语义节点</h2>
      <div id="nodes"></div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let pollTimer = null;

async function loadConfig() {
  const r = await fetch('/api/config');
  const c = await r.json();
  $('base_url').value = c.base_url || '';
  $('api_key').value = c.api_key || '';
  $('model').value = c.model || '';
  $('asr_model').value = c.asr_model || 'glm-asr-2512';
  $('max_steps').value = c.max_steps || 20;
  $('vision').checked = !!c.vision;
}

$('saveCfg').onclick = async () => {
  const body = {
    base_url: $('base_url').value.trim(),
    api_key: $('api_key').value.trim(),
    model: $('model').value.trim(),
    asr_model: $('asr_model').value.trim(),
    max_steps: parseInt($('max_steps').value) || 20,
    vision: $('vision').checked,
  };
  const r = await fetch('/api/config', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  appendLog(r.ok ? '✓ 配置已保存' : '✗ 配置保存失败: ' + await r.text());
};

$('run').onclick = async () => {
  const task = $('task').value.trim();
  if (!task) { appendLog('请输入任务'); return; }
  const r = await fetch('/api/task', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({task}),
  });
  if (r.status === 409) { appendLog('已有任务在运行'); return; }
  appendLog('▶ 任务已启动');
};

$('stop').onclick = async () => { await fetch('/api/stop', {method:'POST'}); };

$('testBtn').onclick = async () => {
  $('testBadge').textContent = '测试中…';
  const r = await fetch('/api/test');
  const j = await r.json();
  $('testBadge').textContent = j.ok ? `感知 ✓ ${j.nodes} 节点` : '感知 ✗';
  appendLog(j.ok ? `测试：感知到 ${j.nodes} 个节点` : `测试失败：${j.error}`);
};

// ---- 语音输入：MediaRecorder(webm) → decode → 16kHz WAV → /api/asr ----
let mediaRec = null, recChunks = [], micStream = null;

// 能力自检：页面加载时把浏览器录音能力写进日志，问题一眼定位
(function () {
  const caps = [];
  caps.push(window.isSecureContext ? '安全上下文✓' : '安全上下文✗(需用 127.0.0.1 打开)');
  caps.push((navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? '麦克风✓' : '麦克风✗');
  caps.push(typeof MediaRecorder !== 'undefined' ? '录音✓' : '录音✗');
  caps.push((window.AudioContext || window.webkitAudioContext) ? '解码✓' : '解码✗');
  appendLog('语音能力自检：' + caps.join(' '));
})();

$('mic').onclick = async () => {
  if (mediaRec && mediaRec.state === 'recording') { mediaRec.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    appendLog('✗ 当前浏览器不支持麦克风（请用 Chrome/系统浏览器，地址必须是 http://127.0.0.1:8080）');
    return;
  }
  if (typeof MediaRecorder === 'undefined') {
    appendLog('✗ 当前浏览器不支持 MediaRecorder，换 Chrome 试试');
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({audio: true});
    recChunks = [];
    mediaRec = new MediaRecorder(micStream);
    mediaRec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = onRecStop;
    mediaRec.onerror = e => appendLog('✗ 录音出错：' + (e.error && e.error.name || 'unknown'));
    mediaRec.start();
    $('mic').textContent = '● 录音中…点击结束';
    $('mic').classList.add('recording');
  } catch (e) {
    appendLog('✗ 录音启动失败：' + e.name + ' ' + e.message +
      (e.name === 'NotAllowedError' ? '（请在浏览器里允许麦克风权限）' : ''));
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    mediaRec = null;
  }
};

async function onRecStop() {
  $('mic').textContent = '🎤 语音输入';
  $('mic').classList.remove('recording');
  micStream.getTracks().forEach(t => t.stop());
  appendLog('识别中…');
  try {
    const blob = new Blob(recChunks, {type: mediaRec.mimeType || 'audio/webm'});
    const wav = await blobToWav16k(blob);
    const b64 = arrayToB64(wav);
    const r = await fetch('/api/asr', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({audio_b64: b64, format: 'wav'}),
    });
    if (!r.ok) { appendLog('✗ 语音识别失败：' + await r.text()); return; }
    const j = await r.json();
    if (!j.text) { appendLog('识别结果为空，请重试'); return; }
    $('task').value = j.text;
    appendLog('🎤 ' + j.text);
    if ($('autoRun').checked) $('run').click();
  } catch (e) {
    appendLog('✗ 语音处理失败：' + e.message);
  }
}

async function blobToWav16k(blob) {
  const ab = await blob.arrayBuffer();
  let ac;
  try { ac = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000}); }
  catch (e) { ac = new (window.AudioContext || window.webkitAudioContext)(); }
  const buf = await ac.decodeAudioData(ab);
  const src = buf.getChannelData(0);
  const ratio = buf.sampleRate / 16000;
  const outLen = Math.floor(src.length / ratio);
  const pcm = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const v = Math.max(-1, Math.min(1, src[Math.floor(i * ratio)]));
    pcm[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
  }
  ac.close();
  const wav = new ArrayBuffer(44 + pcm.length * 2);
  const dv = new DataView(wav);
  const wstr = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true);
  wstr(8, 'WAVE'); wstr(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  wstr(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
  new Int16Array(wav, 44).set(pcm);
  return wav;
}

function arrayToB64(ab) {
  const bytes = new Uint8Array(ab);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}

function appendLog(line) {
  const el = $('logs');
  const t = new Date().toLocaleTimeString();
  el.textContent += `[${t}] ${line}\n`;
  el.scrollTop = el.scrollHeight;
}

function renderNodes(nodes) {
  if (!nodes || !nodes.length) { $('nodes').innerHTML = '<span class="hint">无节点</span>'; return; }
  let html = '<table><tr><th>#</th><th>文本</th><th>坐标</th><th>id</th></tr>';
  for (const n of nodes.slice(0, 40)) {
    html += `<tr><td>${n.Index}</td><td>${escapeHtml(n.Text || n.Desc || n.ID)}</td>` +
            `<td>${n.HasBounds ? n.CenterX + ',' + n.CenterY : '?'}</td>` +
            `<td>${escapeHtml(n.ID)}</td></tr>`;
  }
  $('nodes').innerHTML = html + '</table>';
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function showTap(tap) {
  const img = $('screen'), dot = $('tapdot');
  if (!tap || !img.naturalWidth) { dot.style.display = 'none'; return; }
  const rect = img.getBoundingClientRect();
  // object-fit:contain — the image is letterboxed inside the element
  const scale = Math.min(rect.width / img.naturalWidth, rect.height / img.naturalHeight);
  const dispW = img.naturalWidth * scale, dispH = img.naturalHeight * scale;
  const offX = (rect.width - dispW) / 2, offY = (rect.height - dispH) / 2;
  dot.style.left = (offX + tap.x * scale) + 'px';
  dot.style.top = (offY + tap.y * scale) + 'px';
  dot.style.display = 'block';
}

async function poll() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    $('badge').textContent = s.running ? '运行中 · 第 ' + s.step + ' 步' : '空闲';
    $('badge').className = 'badge' + (s.running ? ' run' : '');
    $('run').disabled = s.running;
    $('stop').disabled = !s.running;
    $('logs').textContent = (s.logs || []).join('\n');
    if (s.logs && s.logs.length) $('logs').scrollTop = $('logs').scrollHeight;
    renderNodes(s.nodes);
    showTap(s.last_tap);
  } catch (e) {}
  const img = $('screen');
  img.src = '/api/screen?t=' + Date.now();
}

loadConfig();
poll();
pollTimer = setInterval(poll, 1500);
</script>
</body>
</html>
