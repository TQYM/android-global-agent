# agent-unified 单一真相源（Single Source of Truth）
#
# 本文件是**整合层唯一需要维护的配置**：两端的地址、端口、版本映射都从这里出发，
# 由 scripts/ 下的脚本下发到各自项目原生的注入点（客户端 dev.local / 服务端 -addr 参数），
# 从而**不修改**任何一端的代码或构建逻辑。
#
# 语法：KEY=VALUE，可由 shell 直接 source，也可由 python 解析（见 scripts/verify-contract.py）。
# 敏感值（API Key、账号密钥、管理令牌）**不放这里**，放 local.env（gitignore）。

# ---------- 整合版发布号（仅整合层使用，不写入两端内部版本号）----------
UNIFIED_VERSION=0.7.0

# ---------- 服务端对外地址（证书 SAN 必须包含 SERVER_HOST）----------
SERVER_HOST=8.133.225.105
SERVER_PORT=18443
# 客户端内嵌的同步服务地址（= https://SERVER_HOST:SERVER_PORT，证书 pin 按主机名匹配）
SYNC_URL=https://8.133.225.105:18443

# ---------- 局域网 P2P（两端必须一致：客户端 LanSync.DEFAULT_PORT / 服务端会合端口）----------
LAN_PORT=18444

# ---------- 两端内部版本映射（只读，用于发布清单与契约校验，不修改源码）----------
CLIENT_PACKAGE=com.dsh.agentlite
CLIENT_VERSION_NAME=0.7.0
CLIENT_VERSION_CODE=7
SERVER_VERSION=0.1.0

# ---------- 服务端部署路径（与 server/deploy/* 既有约定一致）----------
SERVER_SSH_HOST=aliyun-ecs
SERVER_SRV_DIR=/srv/agentlite-server
SERVER_DATA_DIR=/var/lib/agentlite-server
SERVER_ENV_FILE=/etc/agentlite-server/env
